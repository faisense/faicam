<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faicam</title>
<style>
  :root { --bg: #f3f6f5; --surface: #fff; --ink: #16201d; --muted: #5a6b65; --line: #d9e1de; --accent: #0a7563; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1412; --surface: #161f1c; --ink: #e3ebe8; --muted: #93a39e; --line: #27332f; --accent: #3cc3ab; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 28px; }
  h1 { margin: 0 0 8px; font-size: 20px; } h1 span { color: var(--accent); }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main><h1>f<span>ai</span>cam</h1><p>$message</p></main>
</body>
</html>
